<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dead Mansion — Hero 0.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a13;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:16px;font-weight:800;text-shadow:2px 2px #000;pointer-events:none}.controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:12px;align-items:end}.btn{pointer-events:auto;border:2px solid #a8a4bb;background:#27253eae;color:white;border-radius:18px;width:70px;height:70px;font-size:28px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}.btn:active,.btn.down{background:#71506f}.shoot{width:88px;height:88px;border-color:#e0a4a0;background:#702b45bb}.hint{position:fixed;top:10px;right:12px;font-size:12px;color:#d4c8dc;text-align:right;pointer-events:none}@media(max-height:420px){.btn{width:62px;height:62px}.shoot{width:74px;height:74px}}</style></head><body><canvas id="game"></canvas><div class="hud" id="hud">♥ ♥ ♥ · Зомби: 0/4</div><div class="hint">DEAD MANSION · HERO 0.2<br>↔ двигаться · ↑ прыгать · ◎ стрелять</div><div class="controls"><div class="cluster"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><div class="cluster"><button class="btn" data-key="jump">↑</button><button class="btn shoot" data-key="shoot">◎</button></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud');let W=960,H=540;const keys={left:false,right:false,jump:false,shoot:false};let p,enemies,bullets,particles,won,over,tick=0,camera=0;const floor=455,world=2400;
function reset(){p={x:90,y:floor-64,w:30,h:64,vx:0,vy:0,hp:3,face:1,ground:false,cool:0,inv:0};enemies=[410,850,1390,1980].map((x,i)=>({x,y:floor-53,w:34,h:53,hp:i===3?3:2,dir:i%2?-1:1,alive:true}));bullets=[];particles=[];won=false;over=false;camera=0}reset();
function resize(){let dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);ctx.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();
function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(s,x,y,size=20,col='#fff'){ctx.fillStyle=col;ctx.font='bold '+size+'px monospace';ctx.fillText(s,x,y)}function burst(x,y,col,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.8)*8,t:25,col})}
function update(){tick++;if(over||won){if(keys.shoot||keys.jump){if(tick%25===0)reset()}return}p.vx=(+keys.right-+keys.left)*4.1;if(p.vx)p.face=Math.sign(p.vx);if(keys.jump&&p.ground){p.vy=-12.8;p.ground=false}p.vy+=.58;p.x=Math.max(12,Math.min(world-p.w,p.x+p.vx));p.y+=p.vy;if(p.y+p.h>=floor){p.y=floor-p.h;p.vy=0;p.ground=true}if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;if(keys.shoot&&p.cool===0){bullets.push({x:p.x+(p.face>0?30:-5),y:p.y+26,vx:p.face*13,t:58});p.cool=18;burst(p.x+(p.face>0?31:0),p.y+25,'#ffcb7c',4)}for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*.55;if(Math.abs(p.x-e.x)<250)e.dir=p.x<e.x?-1:1;if(Math.abs(p.x-e.x)<32&&Math.abs(p.y-e.y)<53&&p.inv===0){p.hp--;p.inv=75;burst(p.x+15,p.y+25,'#c34462',16);if(p.hp<=0)over=true}}for(const b of bullets){b.x+=b.vx;b.t--;for(const e of enemies){if(e.alive&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){e.hp--;b.t=0;burst(b.x,b.y,'#a4d78c',10);if(e.hp<=0){e.alive=false;burst(e.x+17,e.y+25,'#79b26d',24)}break}}}bullets=bullets.filter(b=>b.t>0);for(const a of particles){a.x+=a.vx;a.y+=a.vy;a.vy+=.25;a.t--}particles=particles.filter(a=>a.t>0);if(p.x>world-120&&enemies.every(e=>!e.alive))won=true;camera=Math.max(0,Math.min(world-W,p.x-240));hud.textContent='♥ '.repeat(p.hp)+' · Зомби: '+enemies.filter(e=>!e.alive).length+'/4'}

function drawHero(){
 // Hand-crafted pixel-art character, animated procedurally until final sprite sheet is ready.
 const moving=Math.abs(p.vx)>.1,air=!p.ground,run=moving?Math.sin(tick*.28):0;
 const recoil=p.cool>12?3:0;
 ctx.save();ctx.translate(Math.round(p.x+15),Math.round(p.y+33));ctx.scale(p.face,1);
 const px=(x,y,w,h,c)=>box(x,y,w,h,c);
 // Ground shadow, backpack and jacket silhouette
 if(p.ground){px(-15,30,30,3,'#14121db0')}
 px(-16,-12,9,27,'#25252a');px(-15,-10,6,23,'#584338');
 // Animated legs with bent knees in the air
 if(air){
   px(-11,12,9,13,'#31557c');px(-14,22,10,8,'#3b638d');px(-17,27,14,6,'#704735');
   px(3,12,10,14,'#31557c');px(9,22,9,6,'#3b638d');px(9,26,14,6,'#704735');
 }else{
   let a=Math.round(run*7);
   px(-11,12,9,15+a,'#31557c');px(-11,24+a,10,6,'#416f9b');px(-14,29+a,14,6,'#744a34');
   px(3,12,10,15-a,'#31557c');px(3,24-a,10,6,'#416f9b');px(2,29-a,15,6,'#744a34');
 }
 // Torso: black leather jacket, off-white shirt, seams
 const bob=air?-2:moving?Math.round(Math.abs(run)*2):Math.round(Math.sin(tick*.07));
 ctx.translate(0,bob);
 px(-13,-13,26,27,'#181b21');px(-12,-12,24,24,'#303239');
 px(-5,-12,10,19,'#d5c7b3');px(-8,-12,5,20,'#1d2027');px(5,-12,6,20,'#20242b');
 px(-11,6,22,6,'#25262c');px(-7,9,13,3,'#674c39');
 px(-12,-9,3,15,'#5c5c5c');px(9,-10,3,13,'#525158');
 // Neck and face, dark stubble (no moustache)
 px(-5,-20,11,9,'#c48d6c');px(-9,-33,19,19,'#d4a07c');
 px(1,-22,10,8,'#6c5548');px(6,-25,6,5,'#946d55');px(5,-29,4,3,'#24252a');
 px(-8,-23,5,3,'#8e6655');
 // Dark burgundy red cap with brim
 px(-11,-39,21,8,'#6e1829');px(-8,-42,16,5,'#95283a');
 px(5,-35,13,4,'#4d1222');px(-7,-40,5,2,'#c44b50');
 // Arms and double-barrel shotgun
 const arm=air?-2:recoil?-3:0;
 px(-13,-6+arm,9,17,'#24252c');px(-13,5+arm,8,6,'#c79070');
 px(5,-7+arm,10,13,'#292a31');px(10,1+arm,11,7,'#b67c5f');
 // Shotgun is held forward, barrels and stock, subtle recoil
 const gunX=4-recoil;
 px(gunX,-1+arm,35,6,'#202630');px(gunX+8,-3+arm,29,3,'#9ba9b2');
 px(gunX+8,4+arm,29,2,'#606c78');px(gunX+33,-3+arm,5,9,'#c0c8ce');
 px(gunX-5,3+arm,15,6,'#7e5035');px(gunX+7,5+arm,4,8,'#6d4732');
 px(7,2+arm,9,6,'#d4a07c');
 if(p.cool>13){px(42-recoil,-6+arm,10,10,'#ffb94e');px(49-recoil,-3+arm,10,4,'#ffed9c');px(42-recoil,-10+arm,5,17,'#f0782d')}
 ctx.restore();
}
function draw(){box(0,0,W,H,'#111426');ctx.save();ctx.translate(-camera*.15,0);for(let i=0;i<18;i++){let x=i*170-90;box(x,55,96,365,'#191a30');box(x+13,85,70,105,'#26223b');box(x+29,102,38,74,'#554258');box(x+43,102,9,74,'#1b1b30');box(x+29,135,38,9,'#1b1b30');box(x+4,55,88,14,'#30263a')}ctx.restore();ctx.save();ctx.translate(-camera*.55,0);for(let i=0;i<25;i++){let x=i*115;box(x,235,11,220,'#29263b');box(x-18,225,47,17,'#3e3447');box(x+20,250,48,7,'#332b43')}ctx.restore();ctx.save();ctx.translate(-camera,0);box(0,floor,world,85,'#282334');box(0,floor,world,9,'#665166');for(let x=0;x<world;x+=55){box(x,floor+20+(x%3)*11,48,2,'#443a4a');box(x+16,floor+55,3,3,'#5a4658')}for(let x=190;x<world;x+=440){box(x, floor-75,15,75,'#40384b');box(x-6,floor-82,27,10,'#66566b');box(x+4,floor-100,7,20,'#f5a95b');box(x-14,floor-107,42,9,'#b66b53')}for(const e of enemies){if(!e.alive)continue;box(e.x+5,e.y,25,16,'#8eae82');box(e.x+2,e.y+16,31,32,'#5b6473');box(e.x+7,e.y+48,9,5,'#403d49');box(e.x+23,e.y+48,9,5,'#403d49');box(e.x+7,e.y+8,5,4,'#ff6b69');box(e.x+23,e.y+8,5,4,'#ff6b69');box(e.x-4,e.y+26,8,6,'#a6bb91')}if(!(p.inv&&tick%8<4))drawHero();for(const b of bullets)box(b.x,b.y,14,4,'#ffe8a3');for(const a of particles)box(a.x,a.y,4,4,a.col);box(world-95,floor-100,65,100,'#392a49');box(world-83,floor-88,41,88,'#21192e');text('EXIT',world-91,floor-112,18,'#e7c2b2');ctx.restore();ctx.fillStyle='#090a15aa';ctx.fillRect(0,0,W,50);text('DEAD MANSION',22,33,23,'#d8b4bf');if(over||won){ctx.fillStyle='#070710cc';ctx.fillRect(0,0,W,H);text(won?'ОСОБНЯК ЗАЧИЩЕН!':'ОХОТНИК ПОГИБ',W/2-210,230,34,won?'#a9dcab':'#e89ba9');text('Нажми ↑ или ◎, чтобы начать заново',W/2-245,274,19,'#ddd')} }
let last=0,acc=0;function frame(t){acc+=Math.min(60,t-last||16);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;const set=(v,e)=>{e.preventDefault();keys[k]=v;b.classList.toggle('down',v)};b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);set(true,e)});b.addEventListener('pointerup',e=>set(false,e));b.addEventListener('pointercancel',e=>set(false,e));b.addEventListener('lostpointercapture',()=>{keys[k]=false;b.classList.remove('down')})}const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyJ:'shoot',ControlLeft:'shoot'};addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=false});
</script></body></html>
